name: Probe lockfile
on:
  push:
    branches: [probe-lockfile]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --package-lock-only
      - run: npm ci
      - uses: actions/upload-artifact@v4
        with:
          name: fixed-lockfile
          path: package-lock.json
